openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /subcontractor-request:
    post:
      operationId: submitSubcontractor
      summary: Store a subcontractor inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubcontractorInput"
      responses:
        "201":
          description: Inquiry stored, not emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"
        "400":
          description: Invalid submission
        "429":
          description: Too many submissions
  /contact:
    post:
      operationId: submitContact
      summary: Store a website inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Inquiry stored, not emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactReceipt"
        "400":
          description: Invalid submission
        "429":
          description: Too many submissions
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    SubcontractorInput:
      type: object
      required: [company, street, city, state, zip, country, first, last, mobile, previous, states, cities, workTypes]
      properties:
        company: { type: string, minLength: 1, maxLength: 200 }
        website: { type: string, maxLength: 500 }
        street: { type: string, minLength: 1, maxLength: 300 }
        street2: { type: string, maxLength: 300 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        zip: { type: string, minLength: 1, maxLength: 30 }
        country: { type: string, minLength: 1, maxLength: 100 }
        first: { type: string, minLength: 1, maxLength: 100 }
        last: { type: string, minLength: 1, maxLength: 100 }
        mobile: { type: string, minLength: 1, maxLength: 50 }
        office: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        previous: { type: string, enum: ["Yes", "No"] }
        previousName: { type: string, maxLength: 200 }
        states:
          type: array
          minItems: 1
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 100 }
        cities: { type: string, minLength: 1, maxLength: 2000 }
        workTypes:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
        comments: { type: string, maxLength: 5000 }
    ContactInput:
      type: object
      required: [firstName, lastName, email, subject, message]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 50 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 10000 }
        website: { type: string, maxLength: 0 }
    ContactReceipt:
      type: object
      required: [reference, message]
      properties:
        reference: { type: string }
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

